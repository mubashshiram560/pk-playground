<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="PK Playground logo: a smiling sky-blue cloud holding a little key">
  <title>PK Playground</title>
  <defs>
    <!-- pencil wobble -->
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough)" stroke="#2f3b48" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- soft gray ground shadow -->
    <ellipse cx="62" cy="116" rx="34" ry="5" fill="#d3dbe3" stroke="none"/>

    <!-- cloud: marker colour (offset) + outline -->
    <path id="cloud" d="M33 86C14 86 10 62 29 58 29 36 56 28 67 45 76 33 102 40 101 60 120 62 119 86 99 86Z" fill="#8ccbf3" stroke="none" transform="translate(2.5 2.5)"/>
    <path d="M33 86C14 86 10 62 29 58 29 36 56 28 67 45 76 33 102 40 101 60 120 62 119 86 99 86Z" fill="none"/>
    <!-- cloud highlight -->
    <path d="M36 52q5-9 14-10" fill="none" stroke="#fff" stroke-width="3"/>

    <!-- face -->
    <g stroke="none" fill="#2f3b48">
      <ellipse cx="50" cy="66" rx="3.6" ry="4.4"/>
      <ellipse cx="78" cy="66" rx="3.6" ry="4.4"/>
    </g>
    <g stroke="none" fill="#fff"><circle cx="51.3" cy="64.4" r="1.3"/><circle cx="79.3" cy="64.4" r="1.3"/></g>
    <ellipse cx="42" cy="74" rx="6" ry="3.4" fill="#d3dbe3" stroke="none"/>
    <ellipse cx="86" cy="74" rx="6" ry="3.4" fill="#d3dbe3" stroke="none"/>
    <path d="M57 72q7 7 14 0" fill="none" stroke-width="3"/>

    <!-- little key held in front (gray) -->
    <g transform="scale(.82) translate(14 9)" fill="none">
      <circle cx="72" cy="98" r="10.5" fill="#d3dbe3"/>
      <circle cx="72" cy="98" r="3.6" fill="#fff"/>
      <path d="M79.5 105.5L108 134 M99 125l7-7 M106 132l6-6" stroke-width="4"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#ffe28a" stroke="#2f3b48" stroke-width="2" stroke-linejoin="round" filter="url(#rough)">
    <path d="M108 20l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path d="M18 30l2 4.6 4.6 2-4.6 2-2 4.6-2-4.6-4.6-2 4.6-2z" fill="#d4ebfc"/>
  </g>
</svg>
